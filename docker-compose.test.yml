name: rpznp-habit-tracker-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: habit_tracker_postgres_test
    environment:
      POSTGRES_DB: habit_tracker_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - '5436:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d habit_tracker_test']
      interval: 2s
      timeout: 5s
      retries: 15
